<html lang="pt-BR">

    <meta charset="UTF-8">

    <title>Purple Beats | Sua Playlist Favorita</title>

        /* Cores e Tema (Roxo e Preto) */
        :root {
            --bg-black: #0d0b14;
            --bg-dark-purple: #160e29;
            --card-bg: #1f1538;
            --purple-primary: #8b5cf6;
            --purple-glow: #a78bfa;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --heart-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Topo e Navegação */
        header {
            background-color: var(--bg-dark-purple);
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--purple-primary);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--purple-glow);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--purple-glow);
        }

        /* Banner Hero */
        .hero {
            padding: 4rem 1rem;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-dark-purple) 0%, var(--bg-black) 100%);
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--purple-glow);
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* Container Principal */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.6rem;
            color: var(--purple-glow);
            margin-bottom: 1.2rem;
            border-left: 4px solid var(--purple-primary);
            padding-left: 0.8rem;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }
